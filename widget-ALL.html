<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Signal Widget — Все 7 Индикаторов</title>
    <style>
        /* ============================================================
               GLOBAL RESET & BASE STYLES
            ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1120;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            margin: 0;
        }

        #signal-widget {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============================================================
               WIDGET CORE STYLES
            ============================================================ */
        .crypto-signal-widget {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(16, 24, 40, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            transition: all 0.3s ease;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .widget-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .widget-version {
            font-size: 12px;
            color: #94a3b8;
            margin-left: 12px;
            font-weight: 400;
            -webkit-text-fill-color: #94a3b8;
        }

        .widget-status-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .ws-status {
            font-size: 11px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .last-update {
            font-size: 11px;
            color: #64748b;
            font-weight: 400;
        }

        .tf-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tf-btn {
            padding: 6px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            font-family: inherit;
            outline: none;
        }

        .tf-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .tf-btn.active {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.3);
        }

        /* ============================================================
               СИГНАЛЬНАЯ СЕТКА — КАРТОЧКИ
            ============================================================ */
        .signal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .signal-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            cursor: default;
            position: relative;
            overflow: visible;
        }

        .signal-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(96, 165, 250, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* ============================================================
               МЕРЦАЮЩАЯ ОБВОДКА
            ============================================================ */
        @keyframes glow-border-green-60 { 0% { border-color: rgba(52,211,153,0.2); } 50% { border-color: rgba(52,211,153,0.5); } 100% { border-color: rgba(52,211,153,0.2); } }
        @keyframes glow-border-green-65 { 0% { border-color: rgba(52,211,153,0.3); } 50% { border-color: rgba(52,211,153,0.6); } 100% { border-color: rgba(52,211,153,0.3); } }
        @keyframes glow-border-green-70 { 0% { border-color: rgba(52,211,153,0.4); } 50% { border-color: rgba(52,211,153,0.7); } 100% { border-color: rgba(52,211,153,0.4); } }
        @keyframes glow-border-green-75 { 0% { border-color: rgba(52,211,153,0.5); } 50% { border-color: #34d399; } 100% { border-color: rgba(52,211,153,0.5); } }
        @keyframes glow-border-green-80 { 0% { border-color: rgba(52,211,153,0.6); } 50% { border-color: #10b981; box-shadow:0 0 20px rgba(52,211,153,0.2); } 100% { border-color: rgba(52,211,153,0.6); } }

        @keyframes glow-border-red-60 { 0% { border-color: rgba(248,113,113,0.2); } 50% { border-color: rgba(248,113,113,0.5); } 100% { border-color: rgba(248,113,113,0.2); } }
        @keyframes glow-border-red-65 { 0% { border-color: rgba(248,113,113,0.3); } 50% { border-color: rgba(248,113,113,0.6); } 100% { border-color: rgba(248,113,113,0.3); } }
        @keyframes glow-border-red-70 { 0% { border-color: rgba(248,113,113,0.4); } 50% { border-color: rgba(248,113,113,0.7); } 100% { border-color: rgba(248,113,113,0.4); } }
        @keyframes glow-border-red-75 { 0% { border-color: rgba(248,113,113,0.5); } 50% { border-color: #f87171; } 100% { border-color: rgba(248,113,113,0.5); } }
        @keyframes glow-border-red-80 { 0% { border-color: rgba(248,113,113,0.6); } 50% { border-color: #ef4444; box-shadow:0 0 20px rgba(248,113,113,0.2); } 100% { border-color: rgba(248,113,113,0.6); } }

        .signal-card.buy-60 { animation: glow-border-green-60 2s ease-in-out infinite; }
        .signal-card.buy-65 { animation: glow-border-green-65 1.5s ease-in-out infinite; }
        .signal-card.buy-70 { animation: glow-border-green-70 1.2s ease-in-out infinite; }
        .signal-card.buy-75 { animation: glow-border-green-75 0.9s ease-in-out infinite; }
        .signal-card.buy-80 { animation: glow-border-green-80 0.6s ease-in-out infinite; }

        .signal-card.sell-60 { animation: glow-border-red-60 2s ease-in-out infinite; }
        .signal-card.sell-65 { animation: glow-border-red-65 1.5s ease-in-out infinite; }
        .signal-card.sell-70 { animation: glow-border-red-70 1.2s ease-in-out infinite; }
        .signal-card.sell-75 { animation: glow-border-red-75 0.9s ease-in-out infinite; }
        .signal-card.sell-80 { animation: glow-border-red-80 0.6s ease-in-out infinite; }

        .signal-card.neutral { animation: none !important; border-color: rgba(255,255,255,0.06) !important; box-shadow: none !important; }

        /* ============================================================
               БЭЙДЖ УРОВНЯ СИГНАЛА
            ============================================================ */
        .signal-strength-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            opacity: 0;
            transition: all 0.5s ease;
            letter-spacing: 0.5px;
            z-index: 5;
            text-transform: uppercase;
            pointer-events: none;
            border: 1px solid transparent;
        }
        .signal-strength-badge.visible { opacity: 1; }
        .signal-strength-badge.buy { background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.3); }
        .signal-strength-badge.buy-strong { background: rgba(52,211,153,0.25); color: #10b981; border-color: rgba(52,211,153,0.5); }
        .signal-strength-badge.sell { background: rgba(248,113,113,0.15); color: #f87171; border-color: rgba(248,113,113,0.3); }
        .signal-strength-badge.sell-strong { background: rgba(248,113,113,0.25); color: #ef4444; border-color: rgba(248,113,113,0.5); }

        /* ============================================================
               ВСЕ 7 ИНДИКАТОРОВ
            ============================================================ */
        .indicators-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 8px;
            margin: 10px 0 8px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 70px;
        }

        .indicator-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .indicator-item .ind-label {
            color: #64748b;
            font-weight: 400;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .indicator-item .ind-value {
            font-weight: 600;
            font-size: 11px;
            transition: color 0.3s ease;
            min-width: 36px;
            text-align: right;
        }

        .indicator-item .ind-value.bullish { color: #34d399; }
        .indicator-item .ind-value.bearish { color: #f87171; }
        .indicator-item .ind-value.neutral { color: #94a3b8; }
        .indicator-item .ind-value.strong-bullish { color: #10b981; text-shadow: 0 0 10px rgba(52,211,153,0.3); }
        .indicator-item .ind-value.strong-bearish { color: #ef4444; text-shadow: 0 0 10px rgba(248,113,113,0.3); }

        .indicator-bar-wrap {
            flex: 1;
            margin: 0 6px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .indicator-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 50%;
        }
        .indicator-bar-fill.bullish { background: linear-gradient(90deg, #34d399, #6ee7b7); }
        .indicator-bar-fill.bearish { background: linear-gradient(90deg, #f87171, #fca5a5); }
        .indicator-bar-fill.neutral { background: linear-gradient(90deg, #64748b, #94a3b8); }

        /* ============================================================
               ИНДИКАТОРЫ ДЕЙСТВИЙ (WAIT/BUY/SELL)
            ============================================================ */
        .action-indicators {
            display: flex;
            gap: 6px;
            margin: 8px 0 4px 0;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-indicator {
            flex: 1;
            text-align: center;
            padding: 4px 2px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.2px;
            transition: all 0.4s ease;
            position: relative;
        }

        .action-indicator .label {
            display: block;
            font-size: 8px;
            font-weight: 400;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .action-indicator .value {
            display: block;
            font-size: 14px;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .action-indicator .bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
            position: relative;
        }

        .action-indicator .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .action-indicator.wait .bar-fill { background: linear-gradient(90deg, #64748b, #94a3b8); }
        .action-indicator.buy .bar-fill { background: linear-gradient(90deg, #34d399, #6ee7b7); }
        .action-indicator.sell .bar-fill { background: linear-gradient(90deg, #f87171, #fca5a5); }

        .action-indicator.wait.active { background: rgba(148,163,184,0.1); }
        .action-indicator.buy.active { background: rgba(52,211,153,0.1); }
        .action-indicator.sell.active { background: rgba(248,113,113,0.1); }

        .action-indicator.wait .value { color: #94a3b8; }
        .action-indicator.buy .value { color: #34d399; }
        .action-indicator.sell .value { color: #f87171; }

        @keyframes pulse-glow { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
        .action-indicator.active .value { animation: pulse-glow 2s ease-in-out infinite; }

        .card-footer {
            margin-top: 4px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tf-signal {
            font-size: 9px;
            color: #475569;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .asset-name {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.2px;
        }

        .asset-price {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }

        .card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .signal-direction {
            font-size: 14px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .signal-confidence {
            font-size: 20px;
            font-weight: 700;
            color: #475569;
            transition: color 0.3s ease;
        }

        /* ============================================================
               ИСТОРИЯ ТОРГОВЛИ
            ============================================================ */
        .trade-history-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .trade-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .trade-history-title {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.3px;
        }

        .trade-history-title span { color: #e2e8f0; }

        .trade-history-stats {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: #64748b;
            flex-wrap: wrap;
        }

        .trade-history-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .trade-history-stats .stat-value { font-weight: 600; color: #e2e8f0; }
        .stat-value.win { color: #34d399; }
        .stat-value.loss { color: #f87171; }
        .stat-value.total { color: #60a5fa; }

        .trade-history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .trade-history-grid::-webkit-scrollbar { width: 4px; }
        .trade-history-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .trade-history-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .trade-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trade-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .trade-card .trade-info { display: flex; flex-direction: column; gap: 2px; }
        .trade-card .trade-asset { font-weight: 600; font-size: 12px; color: #e2e8f0; }
        .trade-card .trade-detail { font-size: 10px; color: #64748b; }
        .trade-card .trade-result { text-align: right; }
        .trade-card .trade-profit { font-weight: 700; font-size: 13px; }
        .trade-card .trade-profit.positive { color: #34d399; }
        .trade-card .trade-profit.negative { color: #f87171; }
        .trade-card .trade-profit.neutral { color: #94a3b8; }
        .trade-card .trade-time { font-size: 9px; color: #475569; }

        .trade-direction-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .trade-direction-badge.buy-badge { background: rgba(52,211,153,0.15); color: #34d399; }
        .trade-direction-badge.sell-badge { background: rgba(248,113,113,0.15); color: #f87171; }

        /* ============================================================
               ФУТЕР
            ============================================================ */
        .widget-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer-stat { display: flex; align-items: center; gap: 4px; }
        .footer-stat span { color: #e2e8f0; font-weight: 500; }

        /* ============================================================
               ДОКУМЕНТАЦИЯ
            ============================================================ */
        .documentation-section {
            margin-top: 20px;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            line-height: 1.6;
            color: #94a3b8;
            max-height: 400px;
            overflow-y: auto;
        }

        .documentation-section::-webkit-scrollbar { width: 4px; }
        .documentation-section::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .documentation-section::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .documentation-section h3 {
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .documentation-section .doc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .documentation-section .doc-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .documentation-section .doc-card .tf-name {
            font-weight: 600;
            color: #60a5fa;
            font-size: 13px;
        }

        .documentation-section .doc-card .action-buy { color: #34d399; font-weight: 600; }
        .documentation-section .doc-card .action-sell { color: #f87171; font-weight: 600; }
        .documentation-section .doc-card .action-wait { color: #94a3b8; font-weight: 600; }

        .documentation-section .doc-card .risk-label {
            color: #64748b;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .documentation-section .doc-card .risk-value { color: #e2e8f0; font-weight: 500; }

        .doc-legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 8px;
        }

        .doc-legend .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #94a3b8;
        }

        .doc-legend .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .doc-legend .legend-dot.buy-dot { background: #34d399; }
        .doc-legend .legend-dot.sell-dot { background: #f87171; }
        .doc-legend .legend-dot.wait-dot { background: #94a3b8; }
        .doc-legend .legend-dot.strong-dot { background: #10b981; box-shadow: 0 0 10px rgba(52,211,153,0.3); }

        /* ============================================================
               RESPONSIVE
            ============================================================ */
        @media (max-width: 640px) {
            .crypto-signal-widget { padding: 16px; }
            .signal-grid { grid-template-columns: 1fr; gap: 8px; }
            .signal-card { padding: 12px; }
            .widget-title { font-size: 16px; }
            .widget-version { display: none; }
            .widget-header { flex-direction: column; align-items: flex-start; }
            .widget-status-group { width: 100%; justify-content: space-between; }
            .action-indicators { flex-direction: row; gap: 4px; padding: 6px; }
            .action-indicator .value { font-size: 12px; }
            .action-indicator .label { font-size: 7px; }
            .indicators-grid { grid-template-columns: 1fr 1fr; gap: 3px 6px; padding: 8px; }
            .indicator-item { font-size: 9px; padding: 2px 4px; }
            .indicator-item .ind-value { font-size: 10px; min-width: 30px; }
            .trade-history-grid { grid-template-columns: 1fr; max-height: 200px; }
            .trade-history-stats { font-size: 10px; gap: 8px; }
            .signal-strength-badge { font-size: 7px; padding: 1px 6px; top: 4px; right: 4px; }
        }

        @media (max-width: 400px) {
            .indicators-grid { grid-template-columns: 1fr 1fr; }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="signal-widget"></div>

    <script>
        /**
         * ================================================================

            async function fetchHistoricalData(symbol, limit, interval) {
                limit = limit || CONFIG.historyCandles;
                interval = interval || '1h';

                const intervalMap = {
                    '15m': { binance: '15m', bybit: '15', okx: '15m', mexc: '15m', htx: '15min', kucoin: '15min' },
                    '1h': { binance: '1h', bybit: '60', okx: '1H', mexc: '1h', htx: '60min', kucoin: '1hour' },
                    '2h': { binance: '2h', bybit: '120', okx: '2H', mexc: '2h', htx: '2hour', kucoin: '2hour' },
                    '4h': { binance: '4h', bybit: '240', okx: '4H', mexc: '4h', htx: '4hour', kucoin: '4hour' },
                    '1d': { binance: '1d', bybit: 'D', okx: '1D', mexc: '1d', htx: '1day', kucoin: '1day' }
                };

                for (const exchange of EXCHANGE_CONFIG.restEndpoints) {
                    try {
                        const startTime = performance.now();
                        let url = '';
                        const intervalStr = intervalMap[interval]?.[exchange.id] || '1h';

                        switch (exchange.id) {
                            case 'binance':
                                url = `${exchange.url}?symbol=${symbol}&interval=${intervalStr}&limit=${limit}`;
                                break;
                            case 'bybit':
                                url = `${exchange.url}?symbol=${symbol}&interval=${intervalStr}&limit=${limit}`;
                                break;
                            case 'okx':
                                url = `${exchange.url}?instId=${symbol}&bar=${intervalStr}&limit=${limit}`;
                                break;
                            case 'mexc':
                                url = `${exchange.url}?symbol=${symbol}&interval=${intervalStr}&limit=${limit}`;
                                break;
                            case 'coinbase':
                                const granularity = interval === '1h' ? 3600 : interval === '15m' ? 900 : interval === '2h' ?
                                    7200 : interval === '4h' ? 14400 : 86400;
                                url = `${exchange.url}/${symbol}/candles?granularity=${granularity}`;
                                break;
                            case 'htx':
                                url = `${exchange.url}?symbol=${symbol.toLowerCase()}&period=${intervalStr}&size=${limit}`;
                                break;
                            case 'kucoin':
                                url = `${exchange.url}?symbol=${symbol}&type=${intervalStr}&limit=${limit}`;
                                break;
                            default:
                                continue;
                        }

                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), EXCHANGE_CONFIG.timeout);

                        const response = await fetch(url, {
                            headers: { 'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0' },
                            signal: controller.signal
                        });

                        clearTimeout(timeoutId);

                        if (!response.ok) continue;

                        const data = await response.json();
                        const endTime = performance.now();

                        let candles = parseExchangeData(data, exchange.id);

                        if (candles && candles.length >= CONFIG.minCandlesRequired) {
                            return candles;
                        }

                    } catch (error) {
                        // Продолжаем со следующей биржей
                    }
                }

                return [];
            }

            function parseExchangeData(data, exchangeId) {
                try {
                    switch (exchangeId) {
                        case 'binance':
                        case 'mexc':
                            return data.map(k => ({
                                time: k[0],
                                open: parseFloat(k[1]),
                                high: parseFloat(k[2]),
                                low: parseFloat(k[3]),
                                close: parseFloat(k[4]),
                                volume: parseFloat(k[5])
                            }));
                        case 'bybit':
                            if (data.result?.list) {
                                return data.result.list.map(k => ({
                                    time: parseInt(k[0]),
                                    open: parseFloat(k[1]),
                                    high: parseFloat(k[2]),
                                    low: parseFloat(k[3]),
                                    close: parseFloat(k[4]),
                                    volume: parseFloat(k[5])
                                }));
                            }
                            return [];
                        case 'okx':
                            if (data.data) {
                                return data.data.map(k => ({
                                    time: parseInt(k[0]),
                                    open: parseFloat(k[1]),
                                    high: parseFloat(k[2]),
                                    low: parseFloat(k[3]),
                                    close: parseFloat(k[4]),
                                    volume: parseFloat(k[5])
                                }));
                            }
                            return [];
                        case 'coinbase':
                            return data.map(k => ({
                                time: parseInt(k[0]) * 1000,
                                open: parseFloat(k[3]),
                                high: parseFloat(k[2]),
                                low: parseFloat(k[1]),
                                close: parseFloat(k[4]),
                                volume: parseFloat(k[5])
                            }));
                        case 'htx':

                                    high: parseFloat(k[2]),

                                    close: parseFloat(k[4]),
                                    volume: parseFloat(k[5])
                                }));
                            }
                            return [];
                        default:
                            return [];
                    }
                } catch (e) {
                    return [];
                }
            }

            // ============================================================
            //  WEB SOCKET
            // ============================================================

            function setupWebSocket() {
                const streams = CONFIG.assets
                    .map(a => `${CONFIG.symbolMap[a].toLowerCase()}@kline_1m`)
                    .join('/');

                try {
                    state.ws = new WebSocket(`${CONFIG.wsEndpoint}/${streams}`);

                    state.ws.onopen = function() {
                        state.isConnected = true;
                        state.reconnectAttempts = 0;
                        updateStatus('🟢 Live', '#34d399');
                        if (els.connectionInfo) {
                            els.connectionInfo.textContent = '🟢 Подключен';
                            els.connectionInfo.style.color = '#34d399';
                        }
                        if (els.exchangeInfo) {
                            els.exchangeInfo.textContent = '🌐 Binance WS + Мульти REST';
                        }
                    };

                    state.ws.onmessage = function(event) {
                        try {
                            const data = JSON.parse(event.data);
                            if (data && data.k) {
                                handleKlineData(data);
                            }
                        } catch (error) {}
                    };

                    state.ws.onerror = function(error) {
                        console.warn('⚠️ Ошибка WebSocket:', error);
                        updateStatus('⚠️ Ошибка', '#f87171');
                    };

                    state.ws.onclose = function() {
                        state.isConnected = false;
                        updateStatus('🔴 Переподключение...', '#f87171');
                        if (els.connectionInfo) {
                            els.connectionInfo.textContent = '🔴 Отключен';
                            els.connectionInfo.style.color = '#f87171';
                        }
                        reconnectWebSocket();
                    };
                } catch (e) {
                    console.warn('⚠️ Ошибка создания WebSocket:', e);
                }
            }

            function reconnectWebSocket() {
                if (state.reconnectAttempts >= state.maxReconnectAttempts) {
                    updateStatus('❌ Ошибка', '#ef4444');
                    return;
                }
                state.reconnectAttempts++;
                const delay = Math.min(1000 * state.reconnectAttempts, 30000);
                setTimeout(() => {
                    if (!state.isConnected) {
                        setupWebSocket();
                    }
                }, delay);
            }

            function updateStatus(text, color) {
                if (els.status) {
                    els.status.textContent = text;
                    els.status.style.color = color || '#94a3b8';
                }
            }

            // ============================================================
            //  ОБРАБОТКА ДАННЫХ
            // ============================================================

            function handleKlineData(data) {
                const k = data.k;
                const symbol = data.s;
                const asset = Object.keys(CONFIG.symbolMap).find(
                    key => CONFIG.symbolMap[key] === symbol
                );

                if (!asset || !CONFIG.assets.includes(asset)) return;

                if (!state.marketData.has(asset)) {
                    state.marketData.set(asset, []);
                }

                const candles = state.marketData.get(asset);
                candles.push({
                    open: parseFloat(k.o),
                    high: parseFloat(k.h),
                    low: parseFloat(k.l),
                    close: parseFloat(k.c),
                    volume: parseFloat(k.v),
                    time: k.T
                });

                if (candles.length > CONFIG.maxCandles) {
                    candles.splice(0, 100);
                }

                if (!state.signalThrottle) {
                    state.signalThrottle = setTimeout(() => {
                        generateSignals();
                        state.signalThrottle = null;
                    }, 30000);
                }

                updatePriceDisplay(asset, parseFloat(k.c));
            }

            function updatePriceDisplay(asset, price) {
                const card = els.grid?.querySelector(`[data-asset="${asset}"]`);
                if (!card) return;
                const priceEl = card.querySelector('.asset-price');
                if (priceEl) {
                    priceEl.textContent = `$${price.toFixed(2)}`;
                }
            }

            // ============================================================
            //  ИНДИКАТОРЫ
            // ============================================================

            function calculateRSI(data, period) {
                if (!data || data.length < period + 1) {
                    return Array(data ? data.length : 1).fill(50);
                }
                const changes = [];
                for (let i = 1; i < data.length; i++) {
                    changes.push(data[i] - data[i - 1]);
                }
                let avgGain = 0,
                    avgLoss = 0;
                const len = Math.min(period, changes.length);
                for (let i = 0; i < len; i++) {
                    if (changes[i] >= 0) avgGain += changes[i];
                    else avgLoss += Math.abs(changes[i]);
                }
                avgGain /= period;
                avgLoss /= period || 1;
                const rsi = [100 - (100 / (1 + (avgGain / (avgLoss || 1))))];
                for (let i = period; i < changes.length; i++) {
                    const gain = changes[i] >= 0 ? changes[i] : 0;
                    const loss = changes[i] < 0 ? Math.abs(changes[i]) : 0;
                    avgGain = ((avgGain * (period - 1)) + gain) / period;
                    avgLoss = ((avgLoss * (period - 1)) + loss) / period;
                    rsi.push(100 - (100 / (1 + (avgGain / (avgLoss || 1)))));
                }
                return rsi;
            }

            function calculateEMA(data, period) {
                if (!data || data.length === 0) return [];
                const ema = [];
                const k = 2 / (period + 1);
                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    if (i < period) {
                        sum += data[i];
                        ema.push(sum / (i + 1));
                    } else {
                        ema.push((data[i] * k) + (ema[i - 1] * (1 - k)));
                    }
                }
                return ema;
            }

            function calculateMACD(data, fast, slow, signal) {
                if (!data || data.length < slow) {
                    return { macd: [], signal: [], histogram: [] };
                }
                const emaFast = calculateEMA(data, fast);
                const emaSlow = calculateEMA(data, slow);
                const macdLine = emaFast.map((v, i) => v - emaSlow[i]);
                const signalLine = calculateEMA(macdLine.slice(slow - fast), signal);
                const histogram = macdLine.slice(slow - fast).map((v, i) => v - signalLine[i]);
                return {
                    macd: macdLine.slice(slow - fast),
                    signal: signalLine,
                    histogram: histogram
                };
            }

            function calculateATR(candles, period) {
                if (!candles || candles.length < period + 1) {
                    return Array(candles ? candles.length : 1).fill(0.01);
                }
                const tr = [];
                for (let i = 1; i < candles.length; i++) {
                    const h = candles[i].high;
                    const l = candles[i].low;
                    const pc = candles[i - 1].close;
                    tr.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
                }
                const atr = [];
                let sum = 0;
                for (let i = 0; i < tr.length; i++) {
                    if (i < period) {
                        sum += tr[i];
                        atr.push(sum / (i + 1));
                    } else {
                        atr.push(((atr[i - 1] * (period - 1)) + tr[i]) / period);
                    }
                }
                return atr;
            }

            function calculatePOC(candles) {
                if (!candles || candles.length === 0) return 0;
                const priceLevels = new Map();
                const minP = Math.min(...candles.map(c => c.low));
                const maxP = Math.max(...candles.map(c => c.high));
                const bucketSize = (maxP - minP) / 50 || 0.01;
                candles.forEach(c => {
                    const bucket = Math.floor(c.close / (bucketSize || 0.01));
                    priceLevels.set(bucket, (priceLevels.get(bucket) || 0) + c.volume);
                });
                let maxVol = 0,
                    pocBucket = 0;
                for (const [bucket, vol] of priceLevels) {
                    if (vol > maxVol) { maxVol = vol;
                        pocBucket = bucket; }
                }
                return pocBucket * (bucketSize || 0.01) + (bucketSize || 0.01) / 2;
            }

            function calculateCVD(candles) {
                if (!candles || candles.length < 2) return [];
                const cvd = [];
                let cum = 0;
                for (let i = 1; i < candles.length; i++) {
                    const change = candles[i].close - candles[i - 1].close;
                    const vol = candles[i].volume;
                    const delta = change > 0 ? vol * (change / candles[i - 1].close) :
                        change < 0 ? -vol * (Math.abs(change) / candles[i - 1].close) : 0;
                    cum += delta;
                    cvd.push(cum);
                }
                return cvd;
            }

            function calculateBB(data, period, stdDev) {
                if (!data || data.length < period) {
                    return { upper: [], middle: [], lower: [] };
                }
                const upper = [],
                    middle = [],
                    lower = [];
                for (let i = period - 1; i < data.length; i++) {
                    const slice = data.slice(i - period + 1, i + 1);
                    const mean = slice.reduce((a, b) => a + b, 0) / period;
                    const variance = slice.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / period;
                    const std = Math.sqrt(variance);
                    middle.push(mean);
                    upper.push(mean + stdDev * std);
                    lower.push(mean - stdDev * std);
                }
                return { upper, middle, lower };
            }

            function aggregateCandles(candles, tf) {
                if (!candles || candles.length === 0) return [];
                const tfMap = { '15m': 15, '1h': 60, '2h': 120, '4h': 240, '1d': 1440 };
                const minutes = tfMap[tf] || 60;
                const agg = [];
                let current = null;
                for (const c of candles) {
                    if (!current) { current = { ...c };
                        continue; }
                    const diff = (c.time - current.time) / (60 * 1000);
                    if (diff >= minutes) {
                        agg.push(current);
                        current = { ...c };
                    } else {
                        current.high = Math.max(current.high, c.high);
                        current.low = Math.min(current.low, c.low);
                        current.close = c.close;
                        current.volume += c.volume;
                    }
                }
                if (current) agg.push(current);
                return agg;
            }

            // ============================================================
            //  ГЕНЕРАЦИЯ СИГНАЛА
            // ============================================================

            function calculateActionProbabilities(indicators, netScore, buyScore, sellScore, maxScore) {
                let buyProb = Math.min((buyScore / maxScore) * 100, 100);
                let sellProb = Math.min((sellScore / maxScore) * 100, 100);

                const trendStrength = indicators.trendStrength || 0;
                const bbWidth = parseFloat(indicators.bbWidth) || 10;

                if (bbWidth < 5) {
                    buyProb = buyProb * 0.7;
                    sellProb = sellProb * 0.7;
                }

                if (Math.abs(trendStrength) > 2) {
                    if (trendStrength > 0) {
                        buyProb = Math.min(buyProb * 1.3, 100);
                        sellProb = sellProb * 0.7;
                    } else {
                        sellProb = Math.min(sellProb * 1.3, 100);
                        buyProb = buyProb * 0.7;
                    }
                }

                let waitProb = Math.max(100 - (buyProb + sellProb), 0);

                buyProb = Math.round(Math.max(0, Math.min(buyProb, 100)));
                sellProb = Math.round(Math.max(0, Math.min(sellProb, 100)));
                waitProb = Math.round(Math.max(0, Math.min(100 - buyProb - sellProb, 100)));

                return { wait: waitProb, buy: buyProb, sell: sellProb };
            }

            function createEmptySignal(asset, tf, status) {
                status = status || '⏳ Загрузка...';
                const emptyIndicators = {
                    rsi: 0,
                    macd: 0,
                    ema: 0,
                    cvd: 0,
                    bb: 0,
                    volume: 0,
                    poc: 0
                };
                state.indicatorScores.set(asset, emptyIndicators);
                return {
                    asset: asset,
                    timeframe: tf || '1h',
                    direction: 'NEUTRAL',
                    confidence: 0,
                    rawScore: { buy: 0, sell: 0, net: 0 },
                    price: 0,
                    timestamp: Date.now(),
                    indicators: {
                        rsi: 0,
                        macd: '0',
                        ema8: '0',
                        ema50: '0',
                        atr: '0',
                        bbWidth: '0',
                        trendStrength: '0'
                    },
                    actionProbabilities: { wait: 100, buy: 0, sell: 0 },
                    indicatorScores: emptyIndicators,
                    status: status
                };
            }

            function generateSignal(asset, tf) {
                tf = tf || state.currentTF || '1h';
                let rawCandles = state.marketData.get(asset);

                if (!rawCandles || rawCandles.length < CONFIG.minCandlesRequired) {
                    if (!state.loadingStatus[asset]) {
                        state.loadingStatus[asset] = true;
                        loadAssetData(asset).then(() => {
                            state.loadingStatus[asset] = false;
                            generateSignals();
                        });
                    }
                    return createEmptySignal(asset, tf, '⏳ Загрузка...');
                }

                const candles = aggregateCandles(rawCandles, tf);
                if (!candles || candles.length < CONFIG.minCandlesRequired) {
                    return createEmptySignal(asset, tf, '⏳ Недостаточно данных');
                }

                const closes = candles.map(c => c.close);
                const volumes = candles.map(c => c.volume);

                // ---- ВЫЧИСЛЕНИЕ ВСЕХ 7 ИНДИКАТОРОВ ----
                const rsi = calculateRSI(closes, 14);
                const currentRSI = rsi.length > 0 ? rsi[rsi.length - 1] : 50;

                const macd = calculateMACD(closes, 12, 26, 9);
                const hist = macd.histogram;
                const currentHist = hist.length > 0 ? hist[hist.length - 1] : 0;
                const currentMACD = macd.macd.length > 0 ? macd.macd[macd.macd.length - 1] : 0;
                const currentSignal = macd.signal.length > 0 ? macd.signal[macd.signal.length - 1] : 0;
                const prevHist = hist.length > 1 ? hist[hist.length - 2] : currentHist;

                const ema8 = calculateEMA(closes, 8);
                const ema13 = calculateEMA(closes, 13);
                const ema21 = calculateEMA(closes, 21);
                const ema50 = calculateEMA(closes, 50);
                const close = closes[closes.length - 1];
                const e8 = ema8.length > 0 ? ema8[ema8.length - 1] : close;
                const e13 = ema13.length > 0 ? ema13[ema13.length - 1] : close;
                const e21 = ema21.length > 0 ? ema21[ema21.length - 1] : close;
                const e50 = ema50.length > 0 ? ema50[ema50.length - 1] : close;

                const atrArr = calculateATR(candles, 14);
                const atr = atrArr.length > 0 ? atrArr[atrArr.length - 1] : 0.01;

                const poc = calculatePOC(candles);

                const cvdArr = calculateCVD(candles);
                const cvd = cvdArr.length > 0 ? cvdArr[cvdArr.length - 1] : 0;
                const cvdPrev = cvdArr.length > 1 ? cvdArr[cvdArr.length - 2] : cvd;

                const bb = calculateBB(closes, 20, 2);
                const bbUpper = bb.upper.length > 0 ? bb.upper[bb.upper.length - 1] : close * 1.05;
                const bbLower = bb.lower.length > 0 ? bb.lower[bb.lower.length - 1] : close * 0.95;
                const bbMiddle = bb.middle.length > 0 ? bb.middle[bb.middle.length - 1] : close;
                const bbWidth = (bbUpper - bbLower) / (bbMiddle || 1);

                const vol = volumes[volumes.length - 1] || 0;
                const volAvg = volumes.slice(-20).reduce((a, b) => a + b, 0) / 20 || 1;

                // ---- СКОРИНГ ----
                let buyScore = 0,
                    sellScore = 0;
                const indicatorDetails = {};

                // 1. RSI (15%)
                let rsiScore = 0;
                if (currentRSI < 30) { buyScore += 15;
                    rsiScore = 15; } else if (currentRSI > 70) { sellScore += 15;
                    rsiScore = -15; } else if (currentRSI < 40) { buyScore += 5;
                    rsiScore = 5; } else if (currentRSI > 60) { sellScore += 5;
                    rsiScore = -5; }
                indicatorDetails.rsi = rsiScore;

                // 2. MACD (20%)
                let macdScore = 0;
                if (currentHist > 0 && currentMACD > currentSignal) { buyScore += 20;
                    macdScore = 20; } else if (currentHist < 0 && currentMACD < currentSignal) { sellScore += 20;
                    macdScore = -20; } else if (currentHist > prevHist) { buyScore += 10;
                    macdScore = 10; } else if (currentHist < prevHist) { sellScore += 10;
                    macdScore = -10; }
                indicatorDetails.macd = macdScore;

                // 3. EMA Ribbon (20%)
                let emaScore = 0;
                if (close > e8 && e8 > e13 && e13 > e21 && e21 > e50) { buyScore += 20;
                    emaScore = 20; } else if (close < e8 && e8 < e13 && e13 < e21 && e21 < e50) { sellScore += 20;
                    emaScore = -20; }
                indicatorDetails.ema = emaScore;

                // 4. CVD (15%)
                let cvdScore = 0;
                if (cvd > cvdPrev && cvd > 0) { buyScore += 15;
                    cvdScore = 15; } else if (cvd < cvdPrev && cvd < 0) { sellScore += 15;
                    cvdScore = -15; }
                indicatorDetails.cvd = cvdScore;

                // 5. Bollinger Bands (15%)
                let bbScore = 0;
                if (close < bbLower) { buyScore += 15;
                    bbScore = 15; } else if (close > bbUpper) { sellScore += 15;
                    bbScore = -15; } else if (bbWidth < 0.1 && close > bbMiddle) { buyScore += 10;
                    bbScore = 10; } else if (bbWidth < 0.1 && close < bbMiddle) { sellScore += 10;
                    bbScore = -10; }
                indicatorDetails.bb = bbScore;

                // 6. Volume Spike (10%)
                let volScore = 0;
                const volRatio = vol / (volAvg || 1);
                if (volRatio > 1.5 && close > e8) { buyScore += 10;
                    volScore = 10; } else if (volRatio > 1.5 && close < e8) { sellScore += 10;
                    volScore = -10; }
                indicatorDetails.volume = volScore;

                // 7. POC (5%)
                let pocScore = 0;
                const pocDist = Math.abs(close - poc) / (atr || 0.01);
                if (pocDist < 0.2 && close > e8) { buyScore += 5;
                    pocScore = 5; } else if (pocDist < 0.2 && close < e8) { sellScore += 5;
                    pocScore = -5; }
                indicatorDetails.poc = pocScore;

                const netScore = buyScore - sellScore;
                const confidence = Math.min(Math.abs(netScore), 100);
                const trendStrength = (close - e50) / (atr || 0.01);

                let direction = 'NEUTRAL';
                let finalConfidence = confidence;

                if (netScore > 30 && trendStrength > -1) {
                    direction = 'BUY';
                } else if (netScore < -30 && trendStrength < 1) {
                    direction = 'SELL';
                } else if (Math.abs(netScore) < 30 && bbWidth < 0.08) {
                    direction = 'NEUTRAL';
                    finalConfidence = 40;
                } else {
                    direction = 'NEUTRAL';
                    finalConfidence = Math.min(confidence, 50);
                }

                const indicators = {
                    rsi: currentRSI,
                    macd: currentHist,
                    bbWidth: (bbWidth * 100),
                    trendStrength: trendStrength,
                    close: close,
                    e50: e50,
                    atr: atr
                };

                const actionProbs = calculateActionProbabilities(
                    indicators,
                    netScore,
                    buyScore,
                    sellScore,
                    100
                );

                state.indicatorScores.set(asset, indicatorDetails);

                return {
                    asset: asset,
                    timeframe: tf,
                    direction: direction,
                    confidence: Math.round(finalConfidence),
                    rawScore: {
                        buy: Math.round(buyScore),
                        sell: Math.round(sellScore),
                        net: Math.round(netScore)
                    },
                    price: close,
                    timestamp: Date.now(),
                    indicators: {
                        rsi: Math.round(currentRSI),
                        macd: currentHist.toFixed(4),
                        ema8: e8.toFixed(2),
                        ema50: e50.toFixed(2),
                        atr: atr.toFixed(2),
                        bbWidth: (bbWidth * 100).toFixed(1),
                        trendStrength: trendStrength.toFixed(2)
                    },
                    actionProbabilities: actionProbs,
                    indicatorScores: indicatorDetails,
                    status: 'Активен'
                };
            }

            // ============================================================
            //  ЗАГРУЗКА ДАННЫХ
            // ============================================================

            async function loadAssetData(asset) {
                const symbol = CONFIG.symbolMap[asset];
                if (!symbol) return false;

                try {
                    const candles = await fetchHistoricalData(symbol, CONFIG.historyCandles, '1h');

                    if (candles && candles.length > 0) {
                        if (!state.marketData.has(asset)) {
                            state.marketData.set(asset, []);
                        }
                        const existing = state.marketData.get(asset) || [];
                        const merged = [...candles, ...existing];
                        const unique = merged.filter((c, index, self) =>
                            index === self.findIndex(t => t.time === c.time)
                        );
                        unique.sort((a, b) => a.time - b.time);
                        state.marketData.set(asset, unique);
                        state.assetAvailability[asset] = true;
                        return true;
                    } else {
                        state.assetAvailability[asset] = false;
                        return false;
                    }
                } catch (error) {
                    state.assetAvailability[asset] = false;
                    return false;
                }
            }

            async function loadAllAssetsData() {
                const loadingPromises = CONFIG.assets.map(asset => loadAssetData(asset));
                const results = await Promise.all(loadingPromises);
                const loadedCount = results.filter(r => r === true).length;
                return loadedCount;
            }

                );

                if (badge) {
                    badge.className = 'signal-strength-badge';

                }

                    card.classList.add('neutral');

                    if (confidence >= 80) {

                    } else if (confidence >= 75) {

                        badgeClass = 'buy-strong';
                    } else if (confidence >= 70) {
                        signalClass = 'buy-70';
                        badgeText = '📈 BUY 70%+';
                        badgeClass = 'buy';
                    } else if (confidence >= 65) {
                        signalClass = 'buy-65';
                        badgeText = '📈 BUY 65%+';
                        badgeClass = 'buy';
                    } else if (confidence >= 60) {
                        signalClass = 'buy-60';
                        badgeText = '📈 BUY 60%+';
                        badgeClass = 'buy';
                    }
                } else if (direction === 'SELL') {
                    if (confidence >= 80) {
                        signalClass = 'sell-80';
                        badgeText = '🔥 СИЛЬНЫЙ SELL';

                    } else if (confidence >= 75) {
                        signalClass = 'sell-75';
                        badgeText = '💪 SELL 75%+';
                        badgeClass = 'sell-strong';
                    } else if (confidence >= 70) {
                        signalClass = 'sell-70';
                        badgeText = '📉 SELL 70%+';
                        badgeClass = 'sell';
                    } else if (confidence >= 65) {
                        signalClass = 'sell-65';
                        badgeText = '📉 SELL 65%+';
                        badgeClass = 'sell';
                    } else if (confidence >= 60) {
                        signalClass = 'sell-60';
                        badgeText = '📉 SELL 60%+';

                    card.classList.add(signalClass);

            // ============================================================
            //  ОБНОВЛЕНИЕ UI
            // ============================================================

            function generateSignals() {
                const tf = state.currentTF || '1h';

                CONFIG.assets.forEach(asset => {
                    const signal = generateSignal(asset, tf);
                    if (signal) {
                        state.signals.set(asset, signal);
                        updateSignalCard(asset, signal);
                        updateActionIndicators(asset, signal.actionProbabilities);
                        updateIndicatorDisplay(asset, signal.indicatorScores);
                        updateSignalVisualization(asset, signal.direction, signal.confidence);
                    }
                });

                const active = Array.from(state.signals.values())
                    .filter(s => s && s.direction !== 'NEUTRAL' && s.confidence > 45);

                if (els.signalCount) els.signalCount.textContent = active.length;
                if (els.lastUpdate) els.lastUpdate.textContent = new Date().toLocaleTimeString();
                if (els.cacheStatus) els.cacheStatus.textContent = `📊 ${state.marketData.size} активов в кэше`;
            }

            function updateIndicatorDisplay(asset, scores) {
                if (!scores) return;

                const card = els.grid?.querySelector(`[data-asset="${asset}"]`);
                if (!card) return;

                const indicatorsContainer = card.querySelector('.indicators-grid');
                if (!indicatorsContainer) return;

                const items = indicatorsContainer.querySelectorAll('.indicator-item');
                const indicatorKeys = ['rsi', 'macd', 'ema', 'cvd', 'bb', 'volume', 'poc'];
                const maxScore = 20;

                items.forEach((item, index) => {
                    const key = indicatorKeys[index];
                    const score = scores[key] !== undefined ? scores[key] : 0;

                    const valueEl = item.querySelector('.ind-value');
                    const barFill = item.querySelector('.indicator-bar-fill');

                    if (!valueEl || !barFill) return;

                    let direction = 'neutral';
                    let displayValue = '0%';

                    if (score > 0) {
                        const percent = Math.min((score / maxScore) * 100, 100);
                        displayValue = `+${Math.round(percent)}%`;
                        direction = score >= 15 ? 'strong-bullish' : 'bullish';
                    } else if (score < 0) {
                        const percent = Math.min((Math.abs(score) / maxScore) * 100, 100);
                        displayValue = `-${Math.round(percent)}%`;
                        direction = Math.abs(score) >= 15 ? 'strong-bearish' : 'bearish';
                    } else {
                        displayValue = '0%';
                        direction = 'neutral';
                    }

                    valueEl.textContent = displayValue;
                    valueEl.className = `ind-value ${direction}`;

                    const barPercent = Math.min(Math.abs(score) / maxScore * 100, 100);
                    barFill.style.width = `${barPercent}%`;
                    barFill.className = `indicator-bar-fill ${direction === 'strong-bullish' || direction === 'bullish' ? 'bullish' : 
                                                         direction === 'strong-bearish' || direction === 'bearish' ? 'bearish' : 
                                                         'neutral'}`;

            function updateActionIndicators(asset, probs) {
                if (!probs) return;
                const card = els.grid?.querySelector(`[data-asset="${asset}"]`);
                if (!card) return;

                const container = card.querySelector('.action-indicators');

                indicators.forEach(indicator => {

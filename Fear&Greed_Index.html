<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fear & Greed Index Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0f1115;
    --card-bg: #161920;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .fng-widget {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .fng-widget::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(245,158,11,0.03) 0%, transparent 70%);
    pointer-events: none;
  }

  .widget-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }

  .widget-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .widget-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #22c55e;
    background: rgba(34,197,94,0.1);
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .gauge-container {
    position: relative;
    width: 280px;
    height: 160px;
    margin: 0 auto 24px;
  }

  .gauge-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .gauge-track {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 24;
    stroke-linecap: round;
  }

  .gauge-fill {
    fill: none;
    stroke-width: 24;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s ease;
    filter: drop-shadow(0 0 8px currentColor);
  }

  .gauge-needle {
    transform-origin: 140px 140px;
    transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .gauge-center {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  .gauge-value {
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .gauge-label {
    font-size: 14px;
    font-weight: 600;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .gauge-label.extreme-fear { color: #ef4444; }
  .gauge-label.fear { color: #f97316; }
  .gauge-label.neutral { color: #eab308; }
  .gauge-label.greed { color: #84cc16; }
  .gauge-label.extreme-greed { color: #22c55e; }

  .scale-labels {
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 24px;
  }

  .stat-card {
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.04);
    transition: background 0.3s;
  }

  .stat-card:hover {
    background: rgba(255,255,255,0.06);
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
  }

  .stat-value.up { color: #22c55e; }
  .stat-value.down { color: #ef4444; }

  .update-info {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .update-info .next-update {
    color: var(--accent);
    font-weight: 600;
  }

  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    gap: 16px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error-state {
    text-align: center;
    padding: 40px 20px;
  }

  .error-state svg {
    width: 48px;
    height: 48px;
    color: #ef4444;
    margin-bottom: 12px;
  }

  .retry-btn {
    margin-top: 16px;
    padding: 8px 20px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: opacity 0.2s;
  }

  .retry-btn:hover { opacity: 0.85; }

  .fade-in {
    animation: fadeIn 0.6s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Адаптив */
  @media (max-width: 480px) {
    .fng-widget { padding: 24px 20px; }
    .gauge-container { width: 240px; height: 140px; }
    .gauge-value { font-size: 40px; }
  }
</style>
</head>
<body>

<div class="fng-widget" id="fngWidget">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <span style="color: var(--text-muted); font-size: 14px;">Загрузка данных...</span>
  </div>
  
  <div id="contentState" style="display: none;">
    <div class="widget-header">
      <div>
        <div class="widget-title">Fear & Greed Index</div>
        <div class="widget-subtitle">Bitcoin Sentiment</div>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        Live
      </div>
    </div>

    <div class="gauge-container">
      <svg class="gauge-svg" viewBox="0 0 280 160">
        <!-- Фон дуги -->
        <path class="gauge-track" d="M 40 140 A 100 100 0 0 1 240 140" />
        
        <!-- Цветная дуга (будет обновлена JS) -->
        <path id="gaugeFill" class="gauge-fill" d="M 40 140 A 100 100 0 0 1 240 140" 
              stroke-dasharray="314" stroke-dashoffset="314" stroke="#ef4444" />
        
        <!-- Стрелка -->
        <g id="gaugeNeedle" class="gauge-needle">
          <polygon points="136,140 144,140 140,45" fill="#fff" />
          <circle cx="140" cy="140" r="8" fill="#fff" />
          <circle cx="140" cy="140" r="4" fill="var(--card-bg)" />
        </g>
      </svg>
      
      <div class="gauge-center">
        <div class="gauge-value" id="gaugeValue">--</div>
        <div class="gauge-label" id="gaugeLabel">Загрузка...</div>
      </div>
    </div>

    <div class="scale-labels">
      <span>Extreme Fear</span>
      <span>Fear</span>
      <span>Neutral</span>
      <span>Greed</span>
      <span>Extreme Greed</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Вчера</div>
        <div class="stat-value" id="yesterdayVal">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Неделя</div>
        <div class="stat-value" id="weekVal">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Месяц</div>
        <div class="stat-value" id="monthVal">--</div>
      </div>
    </div>

    <div class="update-info">
      Следующее обновление через <span class="next-update" id="nextUpdate">--</span>
    </div>
  </div>

  <div class="error-state" id="errorState" style="display: none;">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <div style="font-weight: 600; margin-bottom: 4px;">Не удалось загрузить данные</div>
    <div style="font-size: 13px; color: var(--text-muted);">Проверьте подключение к интернету</div>
    <button class="retry-btn" onclick="fetchData()">Повторить</button>
  </div>
</div>

<script>
  const API_URL = 'https://api.alternative.me/fng/?limit=31&format=json';

  // Цвета для диапазонов
  const COLORS = {
    extremeFear: '#ef4444',
    fear: '#f97316',
    neutral: '#eab308',
    greed: '#84cc16',
    extremeGreed: '#22c55e'
  };

  function getColor(value) {
    if (value <= 20) return COLORS.extremeFear;
    if (value <= 40) return COLORS.fear;
    if (value <= 60) return COLORS.neutral;
    if (value <= 80) return COLORS.greed;
    return COLORS.extremeGreed;
  }

  function getLabel(value) {
    if (value <= 20) return { text: 'Extreme Fear', class: 'extreme-fear' };
    if (value <= 40) return { text: 'Fear', class: 'fear' };
    if (value <= 60) return { text: 'Neutral', class: 'neutral' };
    if (value <= 80) return { text: 'Greed', class: 'greed' };
    return { text: 'Extreme Greed', class: 'extreme-greed' };
  }

  function getClassificationClass(value) {
    if (value <= 20) return 'extreme-fear';
    if (value <= 40) return 'fear';
    if (value <= 60) return 'neutral';
    if (value <= 80) return 'greed';
    return 'extreme-greed';
  }

  function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (h > 0) return `${h}ч ${m}м`;
    if (m > 0) return `${m}м ${s}с`;
    return `${s}с`;
  }

  function animateValue(element, start, end, duration) {
    const startTime = performance.now();
    function update(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      const current = Math.round(start + (end - start) * ease);
      element.textContent = current;
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }

  async function fetchData() {
    const loadingEl = document.getElementById('loadingState');
    const contentEl = document.getElementById('contentState');
    const errorEl = document.getElementById('errorState');

    loadingEl.style.display = 'flex';
    contentEl.style.display = 'none';
    errorEl.style.display = 'none';

    try {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error('Network error');
      const data = await response.json();
      
      if (!data.data || data.data.length === 0) throw new Error('No data');

      const current = data.data[0];
      const yesterday = data.data[1];
      const weekAgo = data.data[6] || data.data[data.data.length - 1];
      const monthAgo = data.data[data.data.length - 1];

      const value = parseInt(current.value);
      const label = getLabel(value);

      // Обновляем UI
      document.getElementById('gaugeValue').textContent = value;
      document.getElementById('gaugeLabel').textContent = label.text;
      document.getElementById('gaugeLabel').className = 'gauge-label ' + label.class;

      // Анимация стрелки
      // 0 = -90deg (крайняя левая), 100 = 90deg (крайняя правая)
      const angle = -90 + (value / 100) * 180;
      document.getElementById('gaugeNeedle').style.transform = `rotate(${angle}deg)`;

      // Анимация дуги
      const maxArc = 314; // длина полуокружности радиуса 100
      const fillArc = (value / 100) * maxArc;
      const gaugeFill = document.getElementById('gaugeFill');
      gaugeFill.style.stroke = getColor(value);
      gaugeFill.style.strokeDashoffset = maxArc - fillArc;

      // Статистика
      document.getElementById('yesterdayVal').textContent = yesterday ? yesterday.value : '--';
      document.getElementById('weekVal').textContent = weekAgo ? weekAgo.value : '--';
      document.getElementById('monthVal').textContent = monthAgo ? monthAgo.value : '--';

      // Таймер обновления
      if (current.time_until_update) {
        let remaining = parseInt(current.time_until_update);
        const updateEl = document.getElementById('nextUpdate');
        updateEl.textContent = formatTime(remaining);
        
        // Обновляем таймер каждую секунду
        if (window.updateTimer) clearInterval(window.updateTimer);
        window.updateTimer = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(window.updateTimer);
            fetchData();
          } else {
            updateEl.textContent = formatTime(remaining);
          }
        }, 1000);
      }

      // Показываем контент
      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';
      contentEl.classList.add('fade-in');

    } catch (err) {
      console.error('Error:', err);
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
    }
  }

  // Запускаем при загрузке
  fetchData();

  // Автообновление каждые 30 минут
  setInterval(fetchData, 30 * 60 * 1000);
</script>

</body>
</html>
